[project]
name = "british-cycling-utils"
version = "0.6.0"
description = "Unofficial library to work with data exported from British Cycling"
readme = "README.md"
authors = [
    { name = "elliot-100", email = "3186037+elliot-100@users.noreply.github.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "attrs>=25.3.0",
    "cattrs>=25.2.0",
]
[project.urls]
Source = "https://github.com/elliot-100/british-cycling-utils"
Changelog = "https://github.com/elliot-100/british-cycling-utils/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.mypy]
strict = true
# Disallow dynamic typing: use of the dynamic 'Any' type under certain conditions
disallow_any_unimported = true
# None and Optional handling: adjust how values of type 'None' are handled
no_implicit_optional = true
# Configuring warnings: detect code that is sound but redundant or problematic.
warn_unreachable = true
# Configuring error messages
show_error_codes = true
pretty = true

[tool.ruff.lint]
future-annotations = true
select = ["ALL"]
ignore = [
    # Rules that conflict with Ruff formatter:
    "COM812",  # Trailing comma missing
    # Mutually exclusive format choices:
    "D203", "D213",
    # Other:
    "CPY001"  # Missing copyright notice at top of file
]
extend-unsafe-fixes = [
    "TC",  # typing-only-standard-library-import
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-decorators = ["attrs.define"]

[tool.ruff.lint.per-file-ignores]
# Not relevant in tests:
"tests/*" = [
    "S101",  # Use of assert detected
    "PLR2004",  # Magic value used in comparison
]

[tool.uv]
resolution = "lowest-direct"
